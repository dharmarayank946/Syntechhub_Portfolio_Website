<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock | VEDA Technology Task 4</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts for modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="page-container">
    <!-- HEADER -->
    <header class="header">
      <span class="sub-heading">VEDA TECHNOLOGY — TASK 4</span>
      <h1 class="main-title">Digital Clock</h1>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <section class="clock-section" aria-label="Digital Clock">
        <div class="clock-card">
          <!-- Clock Display -->
          <div class="clock-display" id="clock-display">
            <div class="time-group">
              <span id="hours" class="time-number">00</span>
              <span class="time-label">HOURS</span>
            </div>
            <span class="colon" aria-hidden="true">:</span>
            <div class="time-group">
              <span id="minutes" class="time-number">00</span>
              <span class="time-label">MINUTES</span>
            </div>
            <span class="colon" aria-hidden="true">:</span>
            <div class="time-group">
              <span id="seconds" class="time-number">00</span>
              <span class="time-label">SECONDS</span>
            </div>
          </div>

          <!-- Status Indicator -->
          <div class="clock-status">
            <span class="pulse-dot"></span>
            <span>Live • Updates Every Second</span>
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <p>Built with HTML5, CSS3 &amp; JavaScript</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
